<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Review Intel social preview</title>
  <desc id="desc">Review Intel helps people see what users love, hate, and wish worked differently in products they already use, with public app reviews behind the findings.</desc>
  <rect width="1200" height="630" fill="#f4efe5"/>
  <path d="M0 0h1200v630H0z" fill="#f4efe5"/>
  <path d="M0 0h1200v630H0z" fill="url(#grain)" opacity=".42"/>
  <rect x="70" y="66" width="1060" height="498" rx="18" fill="#fffaf1" stroke="#171715" stroke-width="3"/>
  <rect x="100" y="96" width="1000" height="64" rx="10" fill="#0f4f46"/>
  <circle cx="130" cy="128" r="9" fill="#f4efe5"/>
  <circle cx="160" cy="128" r="9" fill="#f4efe5" opacity=".72"/>
  <circle cx="190" cy="128" r="9" fill="#f4efe5" opacity=".46"/>
  <text x="100" y="218" fill="#0f4f46" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="2">REVIEW INTEL</text>
  <text x="100" y="306" fill="#171715" font-family="Georgia, 'Times New Roman', serif" font-size="66" font-weight="600">See what people love,</text>
  <text x="100" y="380" fill="#171715" font-family="Georgia, 'Times New Roman', serif" font-size="66" font-weight="600">hate, and wish worked</text>
  <text x="100" y="454" fill="#171715" font-family="Georgia, 'Times New Roman', serif" font-size="66" font-weight="600">differently.</text>
  <line x1="100" y1="506" x2="1100" y2="506" stroke="#171715" stroke-width="2"/>
  <text x="100" y="548" fill="#625e55" font-family="Inter, Arial, sans-serif" font-size="30">In products they already use · backed by public reviews</text>
  <defs>
    <pattern id="grain" width="100" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 1h100" stroke="#171715" stroke-width="1" opacity=".08"/>
    </pattern>
  </defs>
</svg>
