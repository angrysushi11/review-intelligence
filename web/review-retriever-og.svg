<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Review Retriever social preview</title>
  <desc id="desc">Preview card for Review Retriever, a tool for exporting App Store and Google Play reviews into Markdown for product and growth analysis.</desc>
  <rect width="1200" height="630" fill="#f4efe5"/>
  <path d="M0 0h1200v630H0z" fill="#f4efe5"/>
  <path d="M0 0h1200v630H0z" fill="url(#grain)" opacity=".42"/>
  <rect x="70" y="66" width="1060" height="498" rx="18" fill="#fffaf1" stroke="#171715" stroke-width="3"/>
  <rect x="100" y="96" width="1000" height="64" rx="10" fill="#0f4f46"/>
  <circle cx="130" cy="128" r="9" fill="#f4efe5"/>
  <circle cx="160" cy="128" r="9" fill="#f4efe5" opacity=".72"/>
  <circle cx="190" cy="128" r="9" fill="#f4efe5" opacity=".46"/>
  <text x="100" y="218" fill="#0f4f46" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800" letter-spacing="3">APP REVIEW EXPORT</text>
  <text x="100" y="306" fill="#171715" font-family="Georgia, 'Times New Roman', serif" font-size="66" font-weight="600">Review Retriever</text>
  <text x="103" y="366" fill="#34322d" font-family="Inter, Arial, sans-serif" font-size="30">Turn public App Store and Google Play reviews</text>
  <text x="103" y="407" fill="#34322d" font-family="Inter, Arial, sans-serif" font-size="30">into Markdown for product, ASO, positioning,</text>
  <text x="103" y="448" fill="#34322d" font-family="Inter, Arial, sans-serif" font-size="30">and monetization analysis.</text>
  <g transform="translate(790 214)">
    <rect x="0" y="0" width="250" height="268" rx="14" fill="#ebe3d6" stroke="#171715" stroke-width="3"/>
    <rect x="26" y="32" width="198" height="28" rx="6" fill="#171715"/>
    <rect x="26" y="84" width="150" height="16" rx="4" fill="#0f4f46"/>
    <rect x="26" y="118" width="198" height="12" rx="4" fill="#625e55" opacity=".72"/>
    <rect x="26" y="144" width="178" height="12" rx="4" fill="#625e55" opacity=".5"/>
    <rect x="26" y="170" width="196" height="12" rx="4" fill="#625e55" opacity=".72"/>
    <rect x="26" y="196" width="130" height="12" rx="4" fill="#625e55" opacity=".5"/>
    <path d="M184 210l24 28 38-64" fill="none" stroke="#9f513d" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
