  <line x1="100" y1="506" x2="1100" y2="506" stroke="#171715" stroke-width="2"/>
  <text x="100" y="548" fill="#625e55" font-family="Inter, Arial, sans-serif" font-size="22">reviews.doubledash.me</text>
