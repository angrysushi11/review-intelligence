name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 24]

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:package
      - run: npm audit --omit=dev --audit-level=high
      - run: unzip -t web/app-review-growth-analyzer-skill.zip
      - run: node ./bin/review-retriever.js countries > /dev/null
