name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 24]

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:package
      - run: npm audit --omit=dev --audit-level=high
      - run: unzip -t web/app-review-growth-analyzer-skill.zip
      - run: node ./bin/review-retriever.js countries > /dev/null

  plugin-install:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install --global @openai/codex@0.148.0
      - run: codex plugin marketplace add angrysushi11/review-intelligence --ref "$MARKETPLACE_REF" --json
        env:
          MARKETPLACE_REF: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: codex plugin add review-intelligence@doubledash --json
